spring:
  application:
    name: docai-be

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/docai}
    username: ${DB_USERNAME:docai}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

# 외부 API는 연결되지 않으며 시연은 mock만 사용합니다.
docai:
  ai-mode: ${DOCAI_AI_MODE:mock}
  storage-path: ${DOCAI_STORAGE_PATH:./data/masked-pages}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: lax
  tomcat:
    max-http-form-post-size: 30MB

spring.servlet.multipart:
  max-file-size: 5MB
  max-request-size: 30MB
