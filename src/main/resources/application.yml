spring:
  application:
    name: docai-be

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/docai}
    username: ${DB_USERNAME:docai}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-2024-08-06}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  connect-timeout: 10s
  read-timeout: 120s
  # 첫 시도 제외 재시도 횟수. 통신 오류(429, 5xx, 시간 초과, 네트워크 오류)만 1회 (담당_연결지점 A8, 2026-11-16 결정)
  max-retries: 1
  initial-backoff: 1s
  max-backoff: 10s
  # Retry-After 가 이보다 길면 기다리지 않고 실패
  max-retry-after: 30s

law-api:
  key: ${LAW_API_KEY:}
지
docai:
  storage:
    root: ${STORAGE_ROOT:./storage}
  auth:
    token-secret: ${DOCAI_TOKEN_SECRET:}
  analysis:
    # analysis.prompt_version 에 저장 (50자 이하). 5~7단계에서 프롬프트를 만들면 그 버전으로 바꾼다
    prompt-version: extract-v1/judge-v1
    # 쪽 묶음 크기 (아키텍처 2단계)
    pages-per-chunk: 5
    # 사용자별 1분 동안 분석 요청 수. 넘으면 429 RATE_LIMITED (명세에 숫자 없음, 팀 확인 필요)
    requests-per-minute: 5
    # 백그라운드 분석 전용 스레드 수와 대기열
    executor-threads: 4
    executor-queue-capacity: 100
    # heartbeat 갱신 주기, 이만큼 멈추면 FAILED(TEMPORARY_ERROR), 멈춘 분석 검사 주기
    heartbeat-interval: 15s
    stale-after: 2m
    stale-check-interval: 30s
    # 분석 전용 스케줄러 스레드 수 (앱의 다른 @Scheduled 와 나누지 않음, 2 이상)
    scheduler-threads: 2
    scheduler:
      # false 면 분석 스케줄(heartbeat, 멈춘 분석 정리)만 끈다. 다른 @Scheduled 는 영향 없음
      enabled: true

spring.servlet.multipart:
  max-file-size: 20MB
  max-request-size: 105MB
