services:
  db:
    image: postgres:16
    container_name: docai-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - docai-db-data:/var/lib/postgresql/data

volumes:
  docai-db-data:
